[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "golem-bench"
version = "0.1.0.dev0"
description = "GOLEM — Graded Open-ended and multiple-choice LLM Evaluation of antisemitic Misinformation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA.md"]
keywords = ["benchmark", "ai-safety", "red-teaming", "antisemitism", "holocaust-distortion", "evaluation"]
authors = [{ name = "Pritesh Desai", email = "iampriteshdesai@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The item bank and the metric are pure-stdlib on purpose: `golem.validate_mcq`,
# `golem.metric` and `golem.build*` must run in CI with nothing installed, so that the
# thing guarding the benchmark's integrity cannot be broken by a dependency bump.
dependencies = []

[project.optional-dependencies]
# Needed only to actually evaluate a model.
eval = ["inspect-ai>=0.3.260,<0.4", "openai>=1.60,<4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/priteshdesai/golem-bench"
Documentation = "https://github.com/priteshdesai/golem-bench/tree/main/docs"
Issues = "https://github.com/priteshdesai/golem-bench/issues"

[project.scripts]
golem-build      = "golem.build:main"
golem-build-mcq  = "golem.build_mcq:main"
golem-validate   = "golem.validate_mcq:main"
golem-report     = "golem.report_mcq:main"
golem-doc        = "golem.make_doc:main"

[tool.hatch.build.targets.wheel]
packages = ["src/golem"]

[tool.hatch.build.targets.sdist]
# The authored source and the frozen split assignment are maintainer-only and must never
# reach a published artifact — see docs/SPLITS.md.
exclude = ["authoring", "splits", "out", "logs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/golem/data/*.py" = ["E", "W", "I"]   # generated by tools/split.py
"src/golem/taxonomy.py" = ["E501"]
"src/golem/mcq_labels.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
